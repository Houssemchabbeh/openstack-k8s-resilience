# StorageClass for the PostgreSQL volume.
# reclaimPolicy Retain: deleting the PVC keeps the Cinder volume (and the data). Cleanup is manual.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cinder-retain
provisioner: cinder.csi.openstack.org
reclaimPolicy: Retain
# Create the volume only when a pod needs it, on the node where that pod is scheduled.
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  type: lvmdriver-1
