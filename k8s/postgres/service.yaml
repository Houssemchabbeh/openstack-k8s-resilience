# Headless Service: gives the database a stable DNS name (postgres.registration.svc)
# that always points at the current Postgres pod, whichever node it runs on.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: registration
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
