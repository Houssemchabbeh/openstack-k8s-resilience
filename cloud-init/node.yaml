#cloud-config
# First-boot config for node-a and node-b (same file for both).
# Hostname comes from the Nova instance name; the SSH key from the Nova keypair.
# k3s itself is installed by hand in M2 (manual first), not here.

# Use AWS's Ubuntu mirror: VM traffic leaves through the EC2 host, and some
# archive.ubuntu.com servers time out from AWS (seen 2026-11-11 on node-b).
apt:
  primary:
    - arches: [default]
      uri: http://us-east-1.ec2.archive.ubuntu.com/ubuntu/
  security:
    - arches: [default]
      uri: http://us-east-1.ec2.archive.ubuntu.com/ubuntu/

package_update: true
package_upgrade: false   # keep first boot fast; upgrade later if needed

packages:
  - curl   # k3s installer
  - jq     # reading JSON from kubectl / openstack metadata

timezone: Etc/UTC

# Proof for the M1 screenshot (also in /var/log/cloud-init-output.log)
final_message: "cloud-init finished after $UPTIME seconds (datasource: $DATASOURCE)"
